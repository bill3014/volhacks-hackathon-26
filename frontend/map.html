<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTK 3D Campus Crowd Density Tracker</title>
  <link href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/map-styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="sidebar-header">
        <span class="badge">LIVE DEMO</span>
        <h1>UTK 3D Density Map</h1>
        <p id="statusText">Loading UTK 3D buildings...</p>
      </header>

      <div class="controls">
        <input
          type="text"
          id="searchInput"
          placeholder="Filter UTK buildings (e.g., Hodges, Tickle)..."
          aria-label="Filter UTK buildings"
        />
        <div class="button-row">
          <button id="simulateBtn" type="button">Update Crowds</button>
          <button id="autoToggle" type="button" class="secondary">Auto: Off</button>
        </div>
      </div>

      <div class="legend">
        <span><i class="dot low"></i> Low (&lt;45%)</span>
        <span><i class="dot mid"></i> Moderate (45–75%)</span>
        <span><i class="dot high"></i> Busy (&gt;75%)</span>
      </div>

      <ul id="buildingList" class="building-list"></ul>
    </aside>

    <main id="map"></main>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>
  <script src="../data/occupancy.js"></script>
  <script src="../data/utk-buildings.js"></script>
  <script src="js/map-app.js"></script>
</body>
</html>
